  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2 { grid-template-columns: 1fr !important }\n    .asid-5 { grid-template-columns: 1fr 1fr !important }\n    .asid-nav-links { display: none !important }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"background:#F4F0E6;color:#111;font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh\">\n\n  <!-- NAV -->\n  <header style=\"border-bottom:2px solid #16243C;position:sticky;top:0;background:#F4F0E6;z-index:20\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:78px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <div style=\"display:flex;align-items:center;gap:4px\">\n          <div style=\"width:18px;height:18px;background:#7A1E2B\"><\u002Fdiv>\n          <div style=\"width:18px;height:18px;border:2px solid #16243C;box-sizing:border-box\"><\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"font-family:Estedad,sans-serif;font-weight:900;font-size:27px;line-height:1\"><span style=\"color:#16243C\">اسید<\u002Fspan><span style=\"color:#7A1E2B\">بازی<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <nav class=\"asid-nav-links\" style=\"display:flex;align-items:center;gap:34px\">\n        <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"font-size:16px;font-weight:500;color:#111\">خانه<\u002Fa>\n        <a href=\"#\" sc-camel-on-click=\"{{ goEpisode }}\" style=\"font-size:16px;font-weight:500;color:#111\">اپیزودها<\u002Fa>\n        <a href=\"#\" style=\"font-size:16px;font-weight:500;color:#111\">موضوع‌ها<\u002Fa>\n        <a href=\"#\" style=\"font-size:16px;font-weight:500;color:#111\">دربارهٔ ما<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display:flex;align-items:center;gap:0\">\n        <button sc-camel-on-click=\"{{ goEpisode }}\" style=\"font-family:inherit;font-weight:700;font-size:15px;color:#F4F0E6;background:#16243C;border:0;border-radius:0;padding:15px 26px;cursor:pointer;text-align:right\" style-hover=\"background:#0E1828\">شنیدن اپیزود تازه<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <!-- HERO -->\n    <section class=\"asid-hero\" style=\"max-width:1280px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1.25fr 1fr;gap:0;border-bottom:2px solid #16243C\">\n      <div style=\"padding:88px 0 72px;border-left:2px solid #E7E2D5;padding-left:0;display:flex;flex-direction:column;gap:34px\">\n        <span style=\"font:600 12px/1 ui-monospace,monospace;letter-spacing:.24em;color:#7A1E2B\">پادکستِ شیمیِ زندگیِ روزمره<\u002Fspan>\n        <h1 style=\"margin:0;font-family:Estedad,sans-serif;font-weight:900;font-size:clamp(48px,7vw,104px);line-height:1.02;letter-spacing:-.02em;color:#16243C\">اسیدبازی<\u002Fh1>\n        <p style=\"margin:0;max-width:30ch;font-family:Estedad,sans-serif;font-weight:800;font-size:clamp(24px,2.6vw,38px);line-height:1.45;color:#111;text-wrap:pretty\">شیمیِ چیزهایی که هر روز باهاشون زندگی می‌کنیم.<\u002Fp>\n        <p style=\"margin:0;max-width:44ch;font-size:18px;line-height:1.95;color:#16243C;text-wrap:pretty\">اتفاقات معمولی زندگی، معمولاً یه داستان شیمیایی عجیب پشتشون دارن.<\u002Fp>\n        <div style=\"display:flex;align-items:stretch;gap:0;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ goEpisode }}\" style=\"font-family:inherit;font-weight:700;font-size:16px;color:#F4F0E6;background:#7A1E2B;border:0;padding:19px 34px;cursor:pointer;text-align:right\" style-hover=\"background:#5E1621\">اپیزودها را ببین<\u002Fbutton>\n          <button style=\"font-family:inherit;font-weight:700;font-size:16px;color:#16243C;background:transparent;border:2px solid #16243C;padding:19px 34px;cursor:pointer;text-align:right\" style-hover=\"background:#E7E2D5\">شنیدن در اسپاتیفای<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:88px 0 72px 56px;display:flex;align-items:center;justify-content:center;background:#E7E2D5;margin-left:-40px;padding-left:40px\">\n        <div style=\"display:flex;align-items:center;gap:0\">\n          <div style=\"width:96px;height:96px;background:#7A1E2B;animation:asid-open 4.6s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"width:46px;height:3px;background:#16243C\"><\u002Fdiv>\n          <div style=\"width:96px;height:96px;border:3px solid #16243C;box-sizing:border-box;animation:asid-slide 4.6s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"width:34px;height:34px;border-radius:50%;background:#16243C;margin-right:-64px;animation:asid-drop 4.6s ease-in-out infinite\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- LATEST -->\n    <section style=\"max-width:1280px;margin:0 auto;padding:0 40px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:56px 0 18px;border-bottom:2px solid #16243C\">\n        <h2 style=\"margin:0;font-family:Estedad,sans-serif;font-weight:800;font-size:36px;line-height:1;color:#111\">تازه‌ترین اپیزودها<\u002Fh2>\n        <a href=\"#\" style=\"font-size:15px;font-weight:500;color:#7A1E2B\">همه ← <\u002Fa>\n      <\u002Fdiv>\n      <div class=\"asid-3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-bottom:2px solid #16243C\">\n\n        <article style=\"border-left:2px solid #E7E2D5;padding:0 0 30px;display:flex;flex-direction:column\">\n          <div style=\"aspect-ratio:16/10;background:#7A1E2B;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:22px\">\n            <span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.16em;color:#F4F0E6\">EP 05 — طیف مکمل<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:0\"><div style=\"width:34px;height:34px;background:#F4F0E6\"><\u002Fdiv><div style=\"flex:1;height:2px;background:#F4F0E6\"><\u002Fdiv><div style=\"width:22px;height:22px;border-radius:50%;background:#F4F0E6\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-left:26px;display:flex;flex-direction:column;gap:12px\">\n            <h3 style=\"margin:0;font-family:Estedad,sans-serif;font-weight:900;font-size:26px;line-height:1.4;color:#111\">نور خورشید چطور ویتامین می‌سازد؟<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.85;color:#16243C\">پوست فقط پوشش نیست؛ یک کارخانهٔ کوچک است که با نور کار می‌کند.<\u002Fp>\n            <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.14em;color:#7A1E2B\">۲۸ دقیقه — ۱۴ مرداد<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"border-left:2px solid #E7E2D5;padding:0 0 30px;display:flex;flex-direction:column\">\n          <div style=\"aspect-ratio:16/10;background:#16243C;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:22px;background-image:repeating-linear-gradient(to bottom,rgba(244,240,230,.13) 0 2px,transparent 2px 22px)\">\n            <span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.16em;color:#F4F0E6\">EP 04 — طیف زندگی<\u002Fspan>\n            <div style=\"display:flex;gap:0;height:12px\"><div style=\"flex:1;background:#F4F0E6;opacity:.35\"><\u002Fdiv><div style=\"flex:1;background:#F4F0E6;opacity:.6\"><\u002Fdiv><div style=\"flex:1;background:#F4F0E6\"><\u002Fdiv><div style=\"flex:1;background:#7A1E2B\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:0 26px;display:flex;flex-direction:column;gap:12px\">\n            <h3 style=\"margin:0;font-family:Estedad,sans-serif;font-weight:900;font-size:26px;line-height:1.4;color:#111\">چرا برگ‌ها تغییر رنگ می‌دهند؟<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.85;color:#16243C\">رنگِ پاییز رنگِ تازه‌ای نیست؛ رنگی است که تمام تابستان پنهان بوده.<\u002Fp>\n            <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.14em;color:#7A1E2B\">۳۱ دقیقه — ۷ مرداد<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <article style=\"padding:0 0 30px;display:flex;flex-direction:column\">\n          <div style=\"aspect-ratio:16/10;background:#E7E2D5;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:22px\">\n            <span style=\"font:600 10px ui-monospace,monospace;letter-spacing:.16em;color:#7A1E2B\">EP 03 — طیف زندگی<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:10px\"><div style=\"width:30px;height:30px;border-radius:50%;background:#16243C\"><\u002Fdiv><div style=\"width:20px;height:20px;border-radius:50%;background:#7A1E2B\"><\u002Fdiv><div style=\"width:12px;height:12px;border-radius:50%;background:#111\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding-right:26px;display:flex;flex-direction:column;gap:12px\">\n            <h3 style=\"margin:0;font-family:Estedad,sans-serif;font-weight:900;font-size:26px;line-height:1.4;color:#111\">بوی باران از کجا می‌آید؟<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.85;color:#16243C\">آن بو، بوی آب نیست. بوی خاکی است که تازه خیس شده.<\u002Fp>\n            <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.14em;color:#7A1E2B\">۲۴ دقیقه — ۳۱ تیر<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FEATURED -->\n    <section style=\"background:#16243C;margin-top:0\">\n      <div class=\"asid-2\" style=\"max-width:1280px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1fr 1fr;gap:0\">\n        <div style=\"padding:72px 0 72px 0;display:flex;flex-direction:column;gap:26px;justify-content:center\">\n          <span style=\"font:600 12px/1 ui-monospace,monospace;letter-spacing:.24em;color:#F4F0E6;opacity:.7\">اپیزودِ برگزیده<\u002Fspan>\n          <h2 style=\"margin:0;font-family:Estedad,sans-serif;font 48ch;font-family:Estedad,sans-serif;font-weight:600;font-size:21px;line-height:1.7;color:#16243C\">یک آنزیم، سی ثانیه فرصت، و ترکیبی که تا لحظه‌ای پیش وجود نداشت.<\u002Fp>\n\n        <!-- PLAYER -->\n        <div style=\"border:2px solid #16243C;background:#F4F0E6;padding:0;margin-top:8px\">\n          <div style=\"display:flex;align-items:stretch;gap:0\">\n            <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"flex:none;width:82px;background:#16243C;border:0;color:#F4F0E6;font-family:inherit;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#0E1828\">{{ playGlyph }}<\u002Fbutton>\n            <div style=\"flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <span style=\"font-size:15px;font-weight:500;color:#111\">اپیزود ۰۱ — پیاز<\u002Fspan>\n                <span style=\"font:500 12px ui-monospace,monospace;color:#16243C\">{{ elapsed }} / 26:04<\u002Fspan>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ seek }}\" style=\"height:14px;background:#E7E2D5;display:flex;gap:0;cursor:pointer\">\n                <sc-for list=\"{{ segments }}\" as=\"s\" hint-placeholder-count=\"24\">\n                  <div style=\"flex:1;background:{{ s.fill }}\"><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:22px;align-items:center\">\n                <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.12em;color:#7A1E2B\">۱×<\u002Fspan>\n                <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.12em;color:#16243C\">۱۵− ثانیه<\u002Fspan>\n                <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.12em;color:#16243C\">دانلود<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:64px 0 56px 44px;display:flex;flex-direction:column;gap:20px\">\n        <div style=\"aspect-ratio:1;background:#7A1E2B;padding:26px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start\"><span style=\"font:600 11px ui-monospace,monospace;letter-spacing:.16em;color:#F4F0E6\">EP 01<\u002Fspan><span style=\"font:600 11px ui-monospace,monospace;letter-spacing:.16em;color:#F4F0E6\">طیف بدن<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;margin:18px 0;background:repeating-linear-gradient(135deg,rgba(244,240,230,.16) 0 8px,transparent 8px 16px);border:2px solid #F4F0E6;display:flex;align-items:center;justify-content:center\"><span style=\"font:500 10px/1.8 ui-monospace,monospace;letter-spacing:.12em;color:#F4F0E6;text-align:center\">ONION<br>PHOTO 1:1<\u002Fspan><\u002Fdiv>\n          <p style=\"margin:0;font-family:Estedad,sans-serif;font-weight:900;font-size:26px;line-height:1.35;color:#F4F0E6\">پیاز چرا اشکمون<br>رو درمیاره؟<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:0\">\n          <button style=\"flex:1;font-family:inherit;font-weight:700;font-size:15px;color:#F4F0E6;background:#16243C;border:0;padding:16px;cursor:pointer\" style-hover=\"background:#0E1828\">تماشا در یوتیوب<\u002Fbutton>\n          <button style=\"flex:none;font-family:inherit;font-weight:700;font-size:15px;color:#16243C;background:transparent;border:2px solid #16243C;padding:16px 20px;cursor:pointer\" style-hover=\"background:#E7E2D5\">اشتراک‌گذاری<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- BODY + SIDEBAR -->\n    <section class=\"asid-2\" style=\"max-width:1280px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:1.35fr 1fr;gap:0;border-bottom:2px solid #16243C\">\n      <div style=\"padding:56px 0;border-left:2px solid #E7E2D5;padding-left:0;display:flex;flex-direction:column;gap:26px\">\n        <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">دربارهٔ این اپیزود<\u002Fspan>\n        <p style=\"margin:0;max-width:62ch;font-size:18px;line-height:2.05;color:#111\">پیاز تا وقتی سالم است، بی‌آزار است. مشکل از لحظه‌ای شروع می‌شود که چاقو سلول‌ها را پاره می‌کند: دو مادهٔ جدا‌افتاده به هم می‌رسند و واکنشی شکل می‌گیرد که محصولش در پیازِ دست‌نخورده وجود نداشت.<\u002Fp>\n        <p style=\"margin:0;max-width:62ch;font-size:18px;line-height:2.05;color:#111\">آن محصول فرّار است، سبک‌تر از هوا حرکت می‌کند و مسیرش را به سطحِ چشم پیدا می‌کند. آنجا با لایهٔ نازکِ آبِ چشم ترکیب می‌شود و اسیدی ملایم می‌سازد. چشم این را تهدید می‌فهمد و تنها راهی که می‌شناسد را به کار می‌بندد: شستن.<\u002Fp>\n        <div style=\"border-right:6px solid #7A1E2B;padding:22px 26px 22px 0;background:#E7E2D5\">\n          <p style=\"margin:0;font-family:Estedad,sans-serif;font-weight:800;font-size:24px;line-height:1.6;color:#16243C\">اشکِ پیاز واکنشِ بدن به یک اسید است، نه به بو.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:62ch;font-size:18px;line-height:2.05;color:#111\">همین توضیح می‌دهد که چرا پیازِ سرد کم‌آزارتر است، چرا بریدنش زیر آب کار می‌کند، و چرا فن یا هواکش بیشتر از عینکِ شنا کمک می‌کند.<\u002Fp>\n\n        <div style=\"border-top:2px solid #16243C;padding-top:26px;display:flex;flex-direction:column;gap:18px\">\n          <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">نقطه‌های مهم<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ highlights }}\" as=\"h\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid;grid-template-columns:74px 1fr;gap:18px;padding:15px 0;border-top:2px solid #E7E2D5\">\n                <span style=\"font:500 13px ui-monospace,monospace;color:#16243C\">{{ h.time }}<\u002Fspan>\n                <span style=\"font-size:16px;line-height:1.75;color:#111\">{{ h.text }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:56px 0 56px 44px;display:flex;flex-direction:column;gap:38px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">مفاهیمِ علمی<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <span style=\"font-size:15px;color:#16243C;border:2px solid #E7E2D5;padding:9px 15px\">آنزیم<\u002Fspan>\n            <span style=\"font-size:15px;color:#16243C;border:2px solid #E7E2D5;padding:9px 15px\">ترکیبِ فرّار<\u002Fspan>\n            <span style=\"font-size:15px;color:#16243C;border:2px solid #E7E2D5;padding:9px 15px\">اسیدِ ملایم<\u002Fspan>\n            <span style=\"font-size:15px;color:#16243C;border:2px solid #E7E2D5;padding:9px 15px\">واکنشِ دفاعی<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px;background:#E7E2D5;padding:26px\">\n          <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">در یک نگاه<\u002Fspan>\n          <div style=\"display:flex;align-items:center;gap:0\">\n            <div style=\"width:44px;height:44px;background:#7A1E2B\"><\u002Fdiv>\n            <div style=\"flex:1;height:2px;background:#16243C\"><\u002Fdiv>\n            <div style=\"width:24px;height:24px;border-radius:50%;background:#16243C\"><\u002Fdiv>\n            <div style=\"flex:1;height:2px;background:#16243C\"><\u002Fdiv>\n            <div style=\"width:44px;height:44px;border:2px solid #16243C;box-sizing:border-box\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span style=\"font-size:14px;color:#16243C\">پیازِ سالم<\u002Fspan><span style=\"font-size:14px;color:#16243C\">بُرش<\u002Fspan><span style=\"font-size:14px;color:#16243C\">اشک<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">اپیزودهای مرتبط<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ related }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <a href=\"#\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 0;border-top:2px solid #E7E2D5\" style-hover=\"background:#E7E2D5\">\n                <span style=\"font-family:Estedad,sans-serif;font-weight:800;font-size:18px;line-height:1.5;color:#111\">{{ r.title }}<\u002Fspan>\n                <span style=\"font:500 11px ui-monospace,monospace;color:#7A1E2B\">{{ r.num }}<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px;border-top:2px solid #16243C;padding-top:24px\">\n          <span style=\"font:600 12px ui-monospace,monospace;letter-spacing:.22em;color:#7A1E2B\">اشتراک‌گذاری<\u002Fspan>\n          <div style=\"display:flex;gap:0\">\n            <a href=\"#\" style=\"flex:1;text-align:center;font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#16243C;border:2px solid #16243C;padding:14px 0\" style-hover=\"background:#E7E2D5\">TELEGRAM<\u002Fa>\n            <a href=\"#\" style=\"flex:1;text-align:center;font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#16243C;border:2px solid #16243C;border-right-width:0;padding:14px 0\" style-hover=\"background:#E7E2D5\">X<\u002Fa>\n            <a href=\"#\" style=\"flex:1;text-align:center;font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#16243C;border:2px solid #16243C;border-right-width:0;padding:14px 0\" style-hover=\"background:#E7E2D5\">COPY<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- PAGINATION -->\n    <section style=\"max-width:1280px;margin:0 auto;padding:0 40px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:34px 0;border-bottom:2px solid #16243C\">\n        <a href=\"#\" style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 11px ui-monospace,monospace;letter-spacing:.16em;color:#7A1E2B\">→ اپیزود قبلی<\u002Fspan><span style=\"font-family:Estedad,sans-serif;font-weight:800;font-size:19px;color:#111\">فصلِ صفر — چرا اسیدبازی؟<\u002Fspan><\u002Fa>\n        <a href=\"#\" style=\"display:flex;flex-direction:column;gap:6px;text-align:left\"><span style=\"font:500 11px ui-monospace,monospace;letter-spacing:.16em;color:#7A1E2B\">اپیزود بعدی ←<\u002Fspan><span style=\"font-family:Estedad,sans-serif;font-weight:800;font-size:19px;color:#111\">شیمیِ یک فنجان قهوه<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:2px solid #16243C;background:#111;color:#F4F0E6\">\n    <div class=\"asid-3\" style=\"max-width:1280px;margin:0 auto;padding:56px 40px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:Estedad,sans-serif;font-weight:900;font-size:38px;line-height:1;color:#F4F0E6\">اسیدبازی<\u002Fspan>\n        <span style=\"font:600 11px ui-monospace,monospace;letter-spacing:.4em;color:#F4F0E6;opacity:.6\">ASIDBAZI<\u002Fspan>\n        <p style=\"margin:0;max-width:34ch;font-size:15px;line-height:1.9;opacity:.75\">شیمیِ چیزهایی که هر روز باهاشون زندگی می‌کنیم.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 11px ui-monospace,monospace;letter-spacing:.2em;opacity:.55\">پادکست<\u002Fspan>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">اپیزودها<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">موضوع‌ها<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">دربارهٔ ما<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">تماس<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font:600 11px ui-monospace,monospace;letter-spacing:.2em;opacity:.55\">شنیدن<\u002Fspan>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">اسپاتیفای<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">کست‌باکس<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">یوتیوب<\u002Fa>\n        <a href=\"#\" style=\"font-size:15px;color:#F4F0E6\">اینستاگرام<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:2px solid rgba(244,240,230,.2)\">\n      <div style=\"max-width:1280px;margin:0 auto;padding:20px 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px\">\n        <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.1em;opacity:.6\">© ۱۴۰۴ ASIDBAZI<\u002Fspan>\n        <span style=\"font:500 12px ui-monospace,monospace;letter-spacing:.1em;opacity:.6\">SAAKHTEH SHODEH BA KONJKAVI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;episode&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Page&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null, playing: false, pos: 0.34 };\n\n  componentDidMount() {\n    this.timer = setInterval(() => {\n      if (this.state.playing) this.setState(s => ({ pos: s.pos >= 1 ? 0 : s.pos + 0.006 }));\n    }, 120);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  fmt(p) {\n    const total = 26 * 60 + 4;\n    const t = Math.round(total * p);\n    const m = String(Math.floor(t / 60)).padStart(2, \"0\");\n    const s = String(t % 60).padStart(2, \"0\");\n    return m + \":\" + s;\n  }\n\n  renderVals() {\n    const page = this.state.page ?? this.props.startPage ?? \"home\";\n    const n = 24;\n    const filled = Math.round(n * this.state.pos);\n    return {\n      isHome: page === \"home\",\n      isEpisode: page === \"episode\",\n      goHome: (e) => { e.preventDefault(); this.setState({ page: \"home\" }); window.scrollTo(0, 0); },\n      goEpisode: (e) => { e.preventDefault(); this.setState({ page: \"episode\" }); window.scrollTo(0, 0); },\n      togglePlay: () => this.setState(s => ({ playing: !s.playing })),\n      playGlyph: this.state.playing ? \"▮▮\" : \"▶\",\n      elapsed: this.fmt(this.state.pos),\n      seek: (e) => {\n        const r = e.currentTarget.getBoundingClientRect();\n        const p = 1 - (e.clientX - r.left) / r.width;\n        this.setState({ pos: Math.min(1, Math.max(0, p)) });\n      },\n      segments: Array.from({ length: n }, (_, i) => ({ fill: i < filled ? \"#16243C\" : \"transparent\" })),\n      popular: [\n        { num: \"EP 01\", title: \"پیاز چرا اشکمون رو درمیاره؟\", len: \"۲۶:۰۴\" },\n        { num: \"EP 02\", title: \"شیمیِ یک فنجان قهوه\", len: \"۳۳:۱۲\" },\n        { num: \"EP 03\", title: \"بوی باران از کجا می‌آید؟\", len: \"۲۴:۴۰\" },\n        { num: \"EP 06\", title: \"صابون با چربی چه می‌کند؟\", len: \"۲۹:۱۸\" },\n        { num: \"EP 09\", title: \"چرا سیب بریده قهوه‌ای می‌شود؟\", len: \"۲۱:۵۵\" }\n      ],\n      highlights: [\n        { time: \"۰۲:۱۰\", text: \"پیازِ دست‌نخورده هیچ بویی که اشک بیاورد ندارد.\" },\n        { time: \"۰۷:۴۵\", text: \"چاقو دو مادهٔ جدا‌افتاده را به هم می‌رساند.\" },\n        { time: \"۱۴:۳۰\", text: \"محصولِ فرّار در چند ثانیه به سطحِ چشم می‌رسد.\" },\n        { time: \"۲۱:۰۵\", text: \"چرا سرما و آب هر دو کار می‌کنند، اما به دو دلیلِ متفاوت.\" }\n      ],\n      related: [\n        { title: \"صابون با چربی چه می‌کند؟\", num: \"EP 06\" },\n        { title: \"چرا سیب بریده قهوه‌ای می‌شود؟\", num: \"EP 09\" },\n        { title: \"شیمیِ یک فنجان قهوه\", num: \"EP 02\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

<!doctype html>
<html lang="fa" dir="rtl" data-base="../" data-page="groups">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گروه زندگی — جدول</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;600;800;900&family=Vazirmatn:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/jadval.css">
<style>
  .g-hero { display: grid; grid-template-columns: 1.3fr 1fr; gap: var(--space-5); padding-block: 72px; align-items: center; }
  .g-hero__col { font: 700 clamp(96px, 14vw, 200px)/.9 var(--font-mono); letter-spacing: -.06em; opacity: .14; direction: ltr; text-align: left; }
  .g-cells { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding-block: 32px; }
  @media (max-width: 899px) { .g-hero { grid-template-columns: 1fr; padding-block: 48px; } .g-hero__col { display: none; } .g-cells { grid-template-columns: repeat(3, 1fr); } }
  .g-other { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: var(--rule) solid var(--color-rule); }
  @media (max-width: 899px) { .g-other { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<a class="sr-only" href="#main">رفتن به محتوا</a>
<div data-header></div>

<main id="main">
  <div class="wrap"><nav class="crumbs" aria-label="مسیر"><a href="home.html">خانه</a><span aria-hidden="true">/</span><a href="home.html#groups-h">گروه‌ها</a><span aria-hidden="true">/</span><span aria-current="page">گروه زندگی</span></nav></div>

  <section class="band band--navy field-grid--light">
    <div class="wrap g-hero">
      <div class="stack gap-4">
        <div style="display:flex;align-items:center;gap:16px"><div class="gicon gicon--fill gicon--light"></div><span class="kicker" style="color:var(--color-bg);opacity:.75">ستونِ ۱ از ۵</span></div>
        <h1 class="h1">گروه زندگی</h1>
        <p style="max-width:46ch;font-size:18px;line-height:1.95;opacity:.86">بوی باران، رنگِ برگ، کفِ صابون: شیمیِ چیزهایی که بی‌آنکه بخریم‌شان، هر روز دورمان هستند.</p>
        <div class="btn-row"><button class="btn btn--light" data-play="8"><span class="play-icon"></span> پخشِ تازه‌ترینِ این گروه</button></div>
      </div>
      <div class="g-hero__col" aria-hidden="true">01</div>
    </div>
  </section>

  <section class="wrap">
    <div class="section-head"><h2>خانه‌های این ستون</h2><span class="meta">۴ اپیزود — ۱ به‌زودی</span></div>
    <div class="g-cells" id="cells"></div>
    <div class="rows rule-b" id="rows" style="padding-bottom:0"></div>
  </section>

  <section class="wrap">
    <div class="section-head"><h2>ستون‌های دیگر</h2><a href="episodes.html#table">دیدنِ کلِ جدول ←</a></div>
    <div class="g-other groups" id="other"></div>
  </section>
  <div style="height:56px"></div>
</main>

<div data-footer></div>
<script src="../assets/js/jadval.js"></script>
<script>
(function () {
  var J = window.Jadval;
  var mine = J.EPISODES.filter(function (e) { return e.g === 'life'; }).reverse();
  document.getElementById('cells').innerHTML = J.emptyTile(10) + mine.map(function (e) { return J.tile(e, { href: 'episode.html', short: '' }); }).join('');
  document.getElementById('rows').innerHTML = mine.map(function (e) {
    return '<div class="row"><span class="row__num latin">' + J.epNum(e.n) + '</span><a class="row__title" href="episode.html" style="color:inherit">' + e.title + '</a>' +
      '<span class="row__len latin">' + e.len + '</span><button class="row__play" data-play="' + e.n + '" aria-label="پخش"><span class="play-icon"></span></button></div>';
  }).join('');
  var counts = {};
  J.EPISODES.forEach(function (e) { counts[e.g] = (counts[e.g] || 0) + 1; });
  document.getElementById('other').innerHTML = Object.keys(J.GROUPS).filter(function (k) { return k !== 'life'; }).map(function (k) {
    var g = J.GROUPS[k];
    return '<a class="group" href="group.html"><div class="group__head"><div class="gicon gicon--' + g.icon + '"></div><span class="group__col">ستونِ ' + J.fa(g.col) + '</span></div>' +
      '<div class="stack gap-1"><span class="group__name">' + g.name + '</span><span class="group__count">' + J.fa(counts[k] || 0) + ' اپیزود</span></div></a>';
  }).join('');
})();
</script>
</body>
</html>

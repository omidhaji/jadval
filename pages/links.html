<!doctype html>
<html lang="fa" dir="rtl" data-base="../" data-page="links">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عنصر ۱۱۹ — کجا ببینیم و بشنویم</title>
<meta name="description" content="عنصر ۱۱۹ را در یوتیوب، اپل پادکست، کست‌باکس و فیدیبو ببینید و بشنوید؛ تلگرام، اینستاگرام و ایکس.">
<meta name="theme-color" content="#F4F0E6">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;600;800;900&family=Vazirmatn:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/css/jadval.css">
<style>
  /* Link-in-bio page: one narrow column, built for a phone held in one hand. */
  body { background: var(--color-bg); }
  .lp { max-width: 460px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 28px; }
  @media (min-width: 600px) {
    html, body { background: var(--color-bg-2); }
    .lp { margin-block: 40px; background: var(--color-bg); padding: 40px 32px; box-shadow: inset 0 0 0 2px var(--color-navy); }
  }

  /* Brand */
  .lp-brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding-top: 8px; }
  .lp-brand .symbol { --s: 34px; gap: 6px; }
  .lp-brand h1 { font: 900 44px/1.1 var(--font-display); color: var(--color-navy); }
  .lp-brand__tag { font: 800 18px/1.6 var(--font-display); max-width: 28ch; text-wrap: balance; }
  .lp-brand__meta { font-size: 13px; color: var(--color-navy); opacity: .75; }

  /* Section labels */
  .lp-sec { display: flex; flex-direction: column; gap: 10px; }
  .lp-sec > h2 { font: 600 13px var(--font-text); color: var(--color-burgundy); }

  /* Latest episode */
  .lp-ep { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .lp-ep .tile { padding: 10%; }
  .lp-ep__txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lp-ep__txt strong { font: 900 22px/1.35 var(--font-display); }
  .lp-ep__txt span { font-size: 13px; color: var(--color-navy); opacity: .8; }
  .lp-ep__txt .lp-ep__num { font: 600 12px var(--font-mono); letter-spacing: .14em; color: var(--color-burgundy); opacity: 1; text-align: right; direction: ltr; align-self: flex-start; }
  .lp-ep__btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lp-ep__btns .btn { justify-content: center; min-height: 52px; }

  /* Big tap targets */
  .lp-link { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px; color: var(--color-text); background: var(--color-bg); box-shadow: inset 0 0 0 2px var(--color-navy); transition: background-color .15s; }
  .lp-link + .lp-link { margin-top: -2px; }
  .lp-link:hover, .lp-link:focus-visible { background: var(--color-bg-2); color: var(--color-text); }
  .lp-link .picon, .lp-link .picon--text { color: var(--color-navy); flex: none; }
  .lp-link__txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .lp-link__txt small { font-size: 12px; color: var(--color-navy); opacity: .7; }
  .lp-link__txt strong { font: 800 18px/1.35 var(--font-display); }
  .lp-link__arrow { font-size: 18px; color: var(--color-burgundy); }
  .lp-link--main { background: var(--color-burgundy); color: var(--color-bg); box-shadow: none; }
  .lp-link--main:hover, .lp-link--main:focus-visible { background: #943344; color: var(--color-bg); }
  .lp-link--main .picon, .lp-link--main small, .lp-link--main .lp-link__arrow { color: var(--color-bg); }

  /* Socials: three equal squares-ish */
  .lp-social { display: grid; grid-template-columns: repeat(3, 1fr); }
  .lp-social a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 84px; padding: 12px 6px; color: var(--color-navy); box-shadow: inset 0 0 0 2px var(--color-navy); margin-inline-start: -2px; text-align: center; }
  .lp-social a:first-child { margin-inline-start: 0; }
  .lp-social a:hover, .lp-social a:focus-visible { background: var(--color-navy); color: var(--color-bg); }
  .lp-social small { font-size: 13px; font-weight: 600; }

  /* Small secondary links */
  .lp-more { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; font-size: 14px; font-weight: 500; }
  .lp-foot { text-align: center; font-size: 12px; color: var(--color-navy); opacity: .6; }

  /* The page has its own play buttons; the floating player button would cover them. */
  [data-page="links"] .player-fab { display: none; }
</style>
</head>
<body>
<main class="lp" id="main">
  <header class="lp-brand">
    <span class="symbol" aria-hidden="true"><i></i><i></i></span>
    <h1>عنصر ۱۱۹</h1>
    <p class="lp-brand__tag">هنوز چیزهایی برای کشف کردن هست.</p>
    <p class="lp-brand__meta">پادکستِ شیمیِ زندگیِ روزمره · هر سه‌شنبه</p>
  </header>

  <section class="lp-sec" aria-labelledby="lp-new">
    <h2 id="lp-new">اپیزودِ تازه</h2>
    <div class="lp-ep" id="lp-ep"></div>
    <div class="lp-ep__btns" id="lp-ep-btns"></div>
  </section>

  <section class="lp-sec" aria-labelledby="lp-where">
    <h2 id="lp-where">کجا ببینیم و بشنویم</h2>
    <div id="lp-platforms"></div>
  </section>

  <section class="lp-sec" aria-labelledby="lp-follow">
    <h2 id="lp-follow">دنبال کنید</h2>
    <div class="lp-social" id="lp-social"></div>
  </section>

  <nav class="lp-more" aria-label="بیشتر">
    <a href="home.html">وب‌سایت</a>
    <a href="episodes.html">همهٔ اپیزودها</a>
    <a href="contact.html">سؤالت را بفرست</a>
    <a href="#" id="lp-rss" class="latin">RSS</a>
  </nav>

  <p class="lp-foot">© ۱۴۰۵ عنصر ۱۱۹</p>
</main>

<script src="../assets/js/jadval.js"></script>
<script>
(function () {
  var J = window.Jadval;
  // Newest real episode: the latest one with audio from the feed.
  var real = J.EPISODES.filter(function (e) { return e.audio; });
  var e = real[real.length - 1] || J.EPISODES[J.EPISODES.length - 1];

  document.getElementById('lp-ep').innerHTML =
    J.tile(e, { name: false }) +
    '<div class="lp-ep__txt"><span class="lp-ep__num">EP ' + J.pad(e.n) + '</span><strong>' + e.title + '</strong>' +
    '<span>' + J.mins(e.len) + ' — ' + e.date + '</span></div>';

  document.getElementById('lp-ep-btns').innerHTML =
    '<button class="btn btn--burgundy" data-play="' + e.n + '"><span class="play-icon"></span> <span data-play-label="گوش بده">گوش بده</span></button>' +
    '<a class="btn btn--ghost" href="' + (e.video ? J.videoUrl(e) : 'episode.html#video') + '">ویدیو را ببین</a>';

  // YouTube first and highlighted: it carries both the video and the audio.
  document.getElementById('lp-platforms').innerHTML = J.PLATFORMS.map(function (p, i) {
    return '<a class="lp-link' + (i === 0 ? ' lp-link--main' : '') + '" href="' + p.href + '">' + J.picon(p.id, 30) +
      '<span class="lp-link__txt"><small>' + (p.verb || 'شنیدن در') + '</small><strong>' + p.name + '</strong></span>' +
      '<span class="lp-link__arrow" aria-hidden="true">←</span></a>';
  }).join('');

  document.getElementById('lp-social').innerHTML = J.SOCIALS.map(function (s) {
    return '<a href="' + s.href + '" aria-label="' + s.name + ' ' + s.handle + '">' + J.picon(s.id, 26) +
      '<small>' + s.name + '</small></a>';
  }).join('');

  document.getElementById('lp-rss').href = J.FEED_URL;
})();
</script>
</body>
</html>
